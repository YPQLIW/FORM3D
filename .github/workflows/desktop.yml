# FORM3D 설치형 프로그램(Windows) 만들기
# - main 에서 package.json 버전이 바뀌면(또는 Actions 화면에서 직접 실행하면):
#   설치 파일을 만들어 GitHub Releases 의 v버전 에 올립니다 → 설치된 프로그램이 자동 업데이트
# - 같은 버전이 이미 릴리스되어 있으면 새로 올리지 않습니다.
name: Desktop (Windows)

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12.10'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 웹 편집기 빌드
        run: |
          npm ci
          npm run build

      - name: 테스트 (편집 엔진 · 서버)
        run: |
          npx vitest run
          python -m pip install -r backend/requirements-dev.txt
          cd backend
          python -m pytest -q

      - name: 설치 파일 재료 모으기
        run: node scripts/stage-desktop.mjs

      - name: Windows용 Python 내장
        shell: pwsh
        run: |
          $py = "desktop/stage/python"
          $zip = "python-embed.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $py
          $pth = Get-ChildItem "$py/python*._pth" | Select-Object -First 1
          # 서버 코드 위치와 라이브러리 폴더를 경로에 추가
          Set-Content $pth.FullName "python312.zip`r`n.`r`nLib\site-packages`r`n..\form3d\backend`r`nimport site"
          python -m pip install --no-compile --only-binary=:all: --platform win_amd64 --python-version 3.12 --implementation cp `
            --target "$py/Lib/site-packages" -r backend/requirements.txt

      - name: 내장 Python으로 서버가 뜨는지 확인
        shell: pwsh
        run: |
          $env:FORM3D_WEB_DIST = (Resolve-Path desktop/stage/form3d/web).Path
          $env:FORM3D_DATA_DIR = "$env:RUNNER_TEMP\form3d-data"
          $env:FORM3D_PORT = "8799"
          $env:PYTHONUTF8 = "1"
          $p = Start-Process -FilePath desktop/stage/python/python.exe -ArgumentList "-m","app.main" `
            -WorkingDirectory desktop/stage/form3d/backend -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $h = Invoke-RestMethod http://127.0.0.1:8799/api/health
              $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
              if ($h.ok -and $page.Content -match 'FORM3D') { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "내장 Python 서버가 시작되지 않았습니다" }
          Remove-Item -Recurse -Force "$env:FORM3D_DATA_DIR" -ErrorAction SilentlyContinue
          Write-Host "서버 확인 완료: health ok, 편집기 화면 제공"

      - name: 설치 파일 만들기
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          npm ci
          npx electron-builder --win nsis --publish never

      - name: GitHub Releases 에 올리기 (자동 업데이트용)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --title "FORM3D $ver" `
              --notes "FORM3D $ver 설치 파일입니다. 아래 FORM3D-Setup-$ver.exe 를 받아 실행하세요. 이미 설치했다면 프로그램이 자동으로 업데이트합니다."
          }
          gh release upload $tag "desktop/release/FORM3D-Setup-$ver.exe" "desktop/release/FORM3D-Setup-$ver.exe.blockmap" "desktop/release/latest.yml" --clobber
          Write-Host "올림 완료: https://github.com/${{ github.repository }}/releases/tag/$tag"

      - uses: actions/upload-artifact@v4
        with:
          name: FORM3D-Setup
          path: desktop/release/*.exe
          retention-days: 14
