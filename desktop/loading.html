<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>FORM3D</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;color:#cbd5e1;font-family:"Segoe UI","Malgun Gothic",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  h1{margin:0;font-size:22px;letter-spacing:.2em;color:#fff}
  p{margin:0;font-size:13px;color:#94a3b8}
  .bar{width:180px;height:3px;background:#1e2430;border-radius:2px;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);animation:m 1.1s ease-in-out infinite}
  @keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style></head>
<body><h1>FORM3D</h1><div class="bar"><i></i></div><p id="msg">시작하는 중…</p></body></html>
